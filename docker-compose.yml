services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_cric_upgrade
    restart: always
    ports:
      - "3020:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-mysql://cric_web:%40cricweb26@host.docker.internal:3306/cric_cms?connection_limit=10&connect_timeout=30&pool_timeout=30}
      - NEXTAUTH_SECRET=cric-secret-key-super-secure-change-in-prod
      - NEXTAUTH_URL=http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
